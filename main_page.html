<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nabisel</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>



    <div class="left_bar">
        <header class="sitename">
            <img src="images/newlogo.png"
                alt="Logo"
                width="200px">
        
    

        </header>

        <div class="profile_card"> 
            <a href="profile.html" target="_blank">
        

                <img src="images/profile_picture.webp"
                alt="profile_picture"
                width="80px">

                <div class="profile_info">
                    <h2>profile name</h2>
                    <p>mini text</p>
                </div>
            </a>
        </div>

    

        <nav class="mini_logos">
            <div class="logo"> 
                <a href="home.html" target="_blank">

                    <img src="images/mini_logos.webp"
                    alt="home_logo"
                    width="20">
                    <p>home</p>
                </a>
            </div>

            <div class="logo"> 
                
                <a href="notes.html" target="_blank">
                    <img src="images/mini_logos.webp"
                    alt="notes_logo"
                    width="20">
                    <p>notes</p>

                </a>
            
            </div>

            <div class="logo"> 
                <a href="habits.html" target="_blank">
                    <img src="images/mini_logos.webp"
                    alt="habits_logo"
                    width="20">
                    <p>habits</p>
                </a>
            </div>

            <div class="logo"> 
                <a href="goals.html" target="_blank">
                    <img src="images/mini_logos.webp"
                    alt="goals_logo"
                    width="20">
                    <p>goals</p>
                </a>
            </div>
        </nav>

    </div>

    <div class="main_bar">

        <div class="week">

            <h4>Week</h4>
            <div class="days">
                <p>01</p>
                <p>02</p>
                <p>03</p>
                <p>04</p>
            </div>
                
        </div>

        <div class="month">
            <h4>Month</h4>
        
            <div class="months">
                <p>jan</p>
                <p>feb</p>
                <p>mar</p>
                <p>apr</p>
                <p>may</p>
                <p>jun</p>
                <p>jul </p>
                <p>aug</p>
                <p>sep</p>
                <p>oct</p>
                <p>nov</p>
                <p>dec</p>
            </div>
         </div>

    

         <div class="days_of_week">
            <p>Monday</p>
            <p>Tuesday</p>
            <p>Wednesday</p>
            <p>Thursday</p>
            <p>Friday</p>
            <p>Saturday</p>
            <p>Sunday</p>
         </div>




         
    </div>


    </nav>

    


    
</body>
</html>
